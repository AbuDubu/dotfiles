# Linux-only Ghostty settings. ghostty/config loads these through local.conf,
# a symlink install.sh creates on Linux. Ghostty has no per-OS config of its
# own, and window-decoration = none would also strip the title bar and rounded
# corners on macOS, so this can't live in the shared config.

# Hide the title bar / header bar. With no decorations there are no window
# buttons either, so close and move windows with keybinds or the window manager.
window-decoration = none
