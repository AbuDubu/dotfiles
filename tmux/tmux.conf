# ── General ────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# ── Key bindings ───────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Split panes in the current path; drop the hard-to-remember defaults
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in the current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes, repeatable (hold prefix, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move windows left/right
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# Type into every pane in the window at once
bind e setw synchronize-panes \; display-message "synchronize-panes #{?synchronize-panes,on,off}"

# ── Copy mode (vi keys) ────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# ── Gruber Darker theme ────────────────────────────────────────────────────
# Same palette as gruber-darker.nvim (../nvim) and the Ghostty theme
# (../ghostty) — see gruber-darker.nvim/lua/gruber-darker/palette.lua
#   bg #181818  bg+1 #282828  bg+3 #484848  fg #e4e4e4
#   yellow #ffdd33  red #f43841  green #73d936  niagara #96a6c8  quartz #95a99f

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#181818,fg=#e4e4e4"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#181818,bg=#ffdd33,bold] #S #[fg=#ffdd33,bg=#181818]"
set -g status-right "#[fg=#484848,bg=#181818]#[fg=#e4e4e4,bg=#484848] %a %d %b #[fg=#96a6c8,bg=#484848]#[fg=#181818,bg=#96a6c8,bold] %H:%M "

setw -g window-status-format "#[fg=#95a99f,bg=#181818] #I:#W "
setw -g window-status-current-format "#[fg=#181818,bg=#96a6c8,bold] #I:#W#{?window_zoomed_flag, 🔍,} #[fg=#96a6c8,bg=#181818]"

set -g pane-border-style "fg=#484848"
set -g pane-active-border-style "fg=#96a6c8"

set -g message-style "bg=#ffdd33,fg=#181818,bold"
set -g message-command-style "bg=#282828,fg=#e4e4e4"
set -g mode-style "bg=#96a6c8,fg=#181818"

setw -g clock-mode-colour "#96a6c8"
setw -g clock-mode-style 24

# ── Plugins (TPM) ──────────────────────────────────────────────────────────
# prefix + I installs, prefix + U updates, prefix + alt-u removes unused
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
