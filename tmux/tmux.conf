# ── General ────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# ── Key bindings ───────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Split panes in the current path; drop the hard-to-remember defaults
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in the current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes, repeatable (hold prefix, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move windows left/right
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# Type into every pane in the window at once
bind e setw synchronize-panes \; display-message "synchronize-panes #{?synchronize-panes,on,off}"

# ── Copy mode (vi keys) ────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# ── Alabaster Dark theme ───────────────────────────────────────────────────
# Same palette as ../nvim (alabaster.nvim), ../ghostty/themes/alabaster_dark,
# and ../helix/themes/alabaster_dark.toml.
#   bg #0e1415  bg1 #162022  bg2 #293334  fg #cecece
#   accent(active) #cd974b  blue(def) #71ade7  dim(fg8) #708b8d

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#0e1415,fg=#cecece"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#0e1415,bg=#cd974b,bold] #S #[fg=#cd974b,bg=#0e1415]"
set -g status-right "#[fg=#293334,bg=#0e1415]#[fg=#cecece,bg=#293334] %a %d %b #[fg=#71ade7,bg=#293334]#[fg=#0e1415,bg=#71ade7,bold] %H:%M "

setw -g window-status-format "#[fg=#708b8d,bg=#0e1415] #I:#W "
setw -g window-status-current-format "#[fg=#0e1415,bg=#71ade7,bold] #I:#W#{?window_zoomed_flag, 🔍,} #[fg=#71ade7,bg=#0e1415]"

set -g pane-border-style "fg=#293334"
set -g pane-active-border-style "fg=#71ade7"

set -g message-style "bg=#cd974b,fg=#0e1415,bold"
set -g message-command-style "bg=#162022,fg=#cecece"
set -g mode-style "bg=#71ade7,fg=#0e1415"

setw -g clock-mode-colour "#71ade7"
setw -g clock-mode-style 24

# ── Plugins (TPM) ──────────────────────────────────────────────────────────
# prefix + I installs, prefix + U updates, prefix + alt-u removes unused
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
